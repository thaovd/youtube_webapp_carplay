<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CarTube – YouTube cho màn hình ô tô</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=__BUILD__">
</head>
<body>
<div id="app" data-view="home">

  <!-- ===== Thanh điều hướng (rail) ===== -->
  <nav id="rail" aria-label="Điều hướng chính">
    <button class="rail-btn" data-nav="home" aria-label="Thịnh hành">
      <svg viewBox="0 0 24 24"><path d="M13.5 2s.7 3.4-1.4 6.3C10.3 10.8 8 12.3 8 15a4 4 0 0 0 8 0c0-1.3-.5-2.3-1.1-3.2 1.8.5 3.1 2.3 3.1 4.7 0 3.3-2.7 6-6 6s-6-2.7-6-6c0-2.4 1.1-4.3 2.6-5.8C10.3 8.9 11 6.3 13.5 2z"/></svg>
      <span>Xu hướng</span>
    </button>
    <button class="rail-btn" data-nav="subs" aria-label="Kênh đăng ký">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm2-4h12v2H6zm-2 8h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm6 3v5l4-2.5z"/></svg>
      <span>Đăng ký</span>
    </button>
    <button class="rail-btn" data-nav="search" aria-label="Tìm kiếm">
      <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm7.3 11.9 4.4 4.4-1.4 1.4-4.4-4.4z"/></svg>
      <span>Tìm kiếm</span>
    </button>
    <button class="rail-btn" data-nav="library" aria-label="Thư viện">
      <svg viewBox="0 0 24 24"><path d="M3 4h2v16H3zm4 0h2v16H7zm4 0h2v16h-2zm3.6.7 1.9-.5 4.2 15.5-1.9.5z"/></svg>
      <span>Thư viện</span>
    </button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" data-nav="settings" aria-label="Cài đặt">
      <svg viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1l-.4-2.7h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      <span>Cài đặt</span>
    </button>
    <button class="rail-btn rail-account" id="btn-account" aria-label="Tài khoản">
      <img id="account-avatar" alt="" hidden>
      <svg id="account-icon" viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 12c5 0 9 2.2 9 5v3H3v-3c0-2.8 4-5 9-5z"/></svg>
      <span id="account-label">Đăng nhập</span>
    </button>
  </nav>

  <!-- ===== Nội dung chính ===== -->
  <main id="content">
    <header id="topbar">
      <h1 id="view-title">Thịnh hành</h1>
      <div id="topbar-tools"></div>
    </header>

    <div id="chips" class="chips" hidden></div>

    <section id="view" class="view" aria-live="polite"></section>
  </main>

  <!-- ===== Thanh "đang phát" thu nhỏ ===== -->
  <div id="minibar" hidden>
    <img id="mini-thumb" alt="">
    <div class="mini-meta">
      <div id="mini-title" class="ellipsis"></div>
      <div id="mini-channel" class="ellipsis muted"></div>
    </div>
    <button class="ctl" id="mini-play" aria-label="Phát / Tạm dừng">
      <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <button class="ctl" id="mini-next" aria-label="Video tiếp theo">
      <svg viewBox="0 0 24 24"><path d="M6 6l8.5 6L6 18zm10 0h2v12h-2z"/></svg>
    </button>
    <button class="ctl" id="mini-expand" aria-label="Mở trình phát">
      <svg viewBox="0 0 24 24"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg>
    </button>
  </div>

  <!-- ===== Trình phát toàn màn hình ===== -->
  <section id="player" aria-label="Trình phát video">
    <div id="player-main">
      <div id="player-stage">
        <div id="yt-player"></div>
        <!-- Màn che của app khi video tạm dừng / kết thúc: che giao diện tạm dừng của YouTube (tiêu đề, video khác, chia sẻ) -->
        <div id="pause-cover" hidden>
          <img id="cover-img" alt="">
          <div class="cover-center">
            <svg class="cover-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <div class="cover-actions" id="cover-actions" hidden>
              <button class="btn" id="cover-replay" type="button">↻ Phát lại</button>
              <button class="btn primary" id="cover-next" type="button">Video tiếp theo ▶</button>
            </div>
          </div>
        </div>
        <div id="gesture-layer" aria-hidden="true"></div>
        <div id="seek-hint" aria-hidden="true"><span></span></div>
        <div id="player-error" hidden>
          <p>Video này không cho phép phát nhúng.</p>
          <a id="player-error-link" target="_blank" rel="noopener" class="btn">Mở trên YouTube</a>
          <button class="btn" id="player-error-next">Video tiếp theo</button>
        </div>
      </div>

      <div id="player-controls">
        <div class="player-meta">
          <button class="ctl ctl-back" id="btn-close-player" aria-label="Thu nhỏ trình phát">
            <svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
          </button>
          <div class="player-text">
            <div id="player-title" class="ellipsis"></div>
            <div id="player-channel" class="ellipsis muted"></div>
          </div>
          <button class="ctl ctl-sm" id="btn-cc" aria-label="Phụ đề">
            <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6zm3 3h3.5v1.8H8.8v2.4h1.7V15H7zm6 0h3.5v1.8h-1.7v2.4h1.7V15H13z"/></svg>
          </button>
          <button class="ctl ctl-sm" id="btn-quality" aria-label="Chất lượng video">
            <svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm2 2v10h14V7zm2 2h1.6v2.2h2V9h1.6v6h-1.6v-2.2h-2V15H7zm7 0h2.6a2.4 2.4 0 0 1 2.4 2.4v1.2a2.4 2.4 0 0 1-2.4 2.4H14zm1.6 1.6v2.8h1a.8.8 0 0 0 .8-.8v-1.2a.8.8 0 0 0-.8-.8z"/></svg>
          </button>
          <button class="ctl ctl-sm" id="btn-mute" aria-label="Tắt / Bật tiếng">
            <svg class="ic-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
            <svg class="ic-muted" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12a7 7 0 0 1-1.1 3.8l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3zM12 4l-2.1 2.1L12 8.2z"/></svg>
          </button>
          <button class="ctl ctl-sm" id="btn-fullscreen" aria-label="Toàn màn hình video">
            <svg class="ic-expand" viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zm9 0h5v5h-2V7h-3zM5 14h2v3h3v2H5zm12 0h2v5h-5v-2h3z"/></svg>
            <svg class="ic-compress" viewBox="0 0 24 24"><path d="M10 5v5H5V8h3V5zm4 0h2v3h3v2h-5zM5 14h5v5H8v-3H5zm9 0h5v2h-3v3h-2z"/></svg>
          </button>
          <button class="ctl ctl-sm" id="btn-queue-toggle" aria-label="Danh sách phát">
            <svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14-2v6l5-3z"/></svg>
          </button>
        </div>

        <div class="progress-row">
          <span id="time-cur" class="time">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Tua video">
          <span id="time-dur" class="time">0:00</span>
        </div>

        <div class="ctl-row">
          <button class="ctl" id="btn-prev" aria-label="Video trước">
            <svg viewBox="0 0 24 24"><path d="M18 6l-8.5 6L18 18zM6 6h2v12H6z"/></svg>
          </button>
          <button class="ctl" id="btn-rew" aria-label="Lùi 10 giây">
            <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/><text x="12" y="15.5" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor">10</text></svg>
          </button>
          <button class="ctl ctl-big" id="btn-play" aria-label="Phát / Tạm dừng">
            <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button class="ctl" id="btn-fwd" aria-label="Tiến 10 giây">
            <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a5 5 0 1 0 5 5h2a7 7 0 1 1-7-7z"/><text x="12" y="15.5" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor">10</text></svg>
          </button>
          <button class="ctl" id="btn-next" aria-label="Video tiếp theo">
            <svg viewBox="0 0 24 24"><path d="M6 6l8.5 6L6 18zm10 0h2v12h-2z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <aside id="queue" aria-label="Danh sách phát tiếp theo">
      <div class="queue-head">Tiếp theo</div>
      <div id="queue-list"></div>
    </aside>
  </section>

  <!-- ===== Bảng chọn (phụ đề, chất lượng) ===== -->
  <div id="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-list" id="sheet-list"></div>
      <button class="btn" id="sheet-close" type="button">Đóng</button>
    </div>
  </div>

  <!-- ===== Thông báo ===== -->
  <div id="toast" role="status" hidden></div>
</div>

<template id="tpl-card">
  <button class="card" type="button">
    <div class="thumb">
      <img loading="lazy" alt="">
      <span class="dur"></span>
    </div>
    <div class="card-body">
      <div class="card-title"></div>
      <div class="card-sub muted"></div>
    </div>
  </button>
</template>

<script src="js/config.js?v=__BUILD__"></script>
<script src="js/util.js?v=__BUILD__"></script>
<script src="js/auth.js?v=__BUILD__"></script>
<script src="js/api.js?v=__BUILD__"></script>
<script src="js/stream.js?v=__BUILD__"></script>
<script src="js/embed.js?v=__BUILD__"></script>
<script src="js/player.js?v=__BUILD__"></script>
<script src="js/app.js?v=__BUILD__"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="Auth.onGisLoaded()"></script>
</body>
</html>
