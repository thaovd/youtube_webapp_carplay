# CarTube stream server: Invidious (+ companion) + Caddy nội bộ (CORS, lọc Referer), nghe HTTP ở cổng STREAM_PORT
# Cài bằng ./install.sh  (xem README.md trong thư mục này)
services:
  # Caddy ở đây chỉ chạy HTTP (CORS + lọc Referer). TLS do reverse proxy ngoài (nginx / Nginx Proxy Manager) đảm nhiệm.
  # STREAM_BIND=127.0.0.1 nếu proxy cùng máy; 0.0.0.0 nếu proxy ở máy khác (nhớ mở cổng trên router/firewall)
  caddy:
    image: caddy:2
    restart: unless-stopped
    labels: { com.centurylinklabs.watchtower.enable: "true" }
    ports:
      - "${STREAM_BIND:-127.0.0.1}:${STREAM_PORT:-8090}:8090"
    environment:
      ALLOWED_REFERER: ${ALLOWED_REFERER}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - invidious

  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped
    labels: { com.centurylinklabs.watchtower.enable: "true" }
    expose:
      - "3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
          - private_url: "http://companion:8282/companion"
        invidious_companion_key: "${COMPANION_KEY}"
        hmac_key: "${HMAC_KEY}"
        domain: "${DOMAIN}"
        https_only: true
        external_port: 443
        statistics_enabled: false
        registration_enabled: false
        login_enabled: false
        default_user_preferences:
          region: VN
          quality: dash
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    logging:
      options:
        max-size: "200m"
        max-file: "3"
    depends_on:
      invidious-db:
        condition: service_healthy

  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    labels: { com.centurylinklabs.watchtower.enable: "true" }
    environment:
      - SERVER_SECRET_KEY=${COMPANION_KEY}
    logging:
      options:
        max-size: "200m"
        max-file: "3"
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./invidious/config/sql:/config/sql
      - ./invidious/docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

  # Tự cập nhật: mỗi đêm 04:00 kiểm tra image mới của invidious / companion / caddy (theo nhãn), kéo về, khởi động lại, dọn image cũ.
  # Postgres cố ý không tự cập nhật (đổi phiên bản lớn cần chuyển dữ liệu thủ công).
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Asia/Ho_Chi_Minh
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_ROLLING_RESTART: "true"

volumes:
  postgresdata:
  companioncache:
  caddydata:
  caddyconfig:
