# Mẫu server block nginx cho máy chủ stream CarTube.
# Đặt vào /etc/nginx/sites-available/cartube-stream, symlink sang sites-enabled, rồi: sudo nginx -t && sudo systemctl reload nginx
# Chứng chỉ: sudo certbot --nginx -d ddns.vuthao.id.vn  (hoặc dùng chứng chỉ sẵn có)

server {
    listen 443 ssl http2;
    server_name ddns.vuthao.id.vn;

    ssl_certificate     /etc/letsencrypt/live/ddns.vuthao.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ddns.vuthao.id.vn/privkey.pem;

    client_max_body_size 0;
    proxy_buffering off;             # luồng video: truyền thẳng, không đệm
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;          # tua video cần Range
        proxy_set_header If-Range $http_if_range;
    }
}

server {
    listen 80;
    server_name ddns.vuthao.id.vn;
    return 301 https://$host$request_uri;
}
