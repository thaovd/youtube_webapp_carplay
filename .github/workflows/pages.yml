name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/jolly-mccarthy-uryzuj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build id (cache busting)
        run: |
          BUILD="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BUILD/g" index.html js/config.js
          echo "$BUILD" > version.txt
          echo "Build $BUILD"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
